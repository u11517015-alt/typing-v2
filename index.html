<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英打遊戲版本二</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: white;
        }

        h1 {
            margin-bottom: 20px;
        }

        img {
            width: 500px;
            max-width: 80%;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>英打遊戲版本二</h1>

    <img src="assets/keyboard.png" alt="鍵盤">

    <button id="startButton" type="button">開始</button>

    <audio id="beepSound" src="assets/beep.wav"></audio>

    <script>
        const startButton = document.getElementById("startButton");
        const beepSound = document.getElementById("beepSound");

        startButton.addEventListener("click", () => {
            beepSound.currentTime = 0;
            beepSound.play();
        });
    </script>

</body>
</html>
